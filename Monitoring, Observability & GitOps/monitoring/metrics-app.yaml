# A tiny HTTP app that exposes Prometheus metrics on /metrics
# (http_requests_total, version), with probes so Kubernetes and
# kube-state-metrics can report its health. Scraped via the ServiceMonitor below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session20-metrics-app
  labels:
    app: session20-metrics-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session20-metrics-app
  template:
    metadata:
      labels:
        app: session20-metrics-app
    spec:
      containers:
        - name: app
          image: quay.io/brancz/prometheus-example-app:v0.5.0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: session20-metrics-app
  labels:
    app: session20-metrics-app
spec:
  selector:
    app: session20-metrics-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: session20-metrics-app
  labels:
    app: session20-metrics-app
spec:
  selector:
    matchLabels:
      app: session20-metrics-app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
