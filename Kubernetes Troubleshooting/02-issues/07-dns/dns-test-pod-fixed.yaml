# The class dns-test pod uses registry.k8s.io/e2e-test-images/dnsutils:1.3,
# which no longer exists (the repository has no tags -> ErrImagePull).
# jessie-dnsutils is its maintained successor in the same e2e image set and
# ships nslookup, dig and host.
apiVersion: v1
kind: Pod
metadata:
  name: dns-test
spec:
  containers:
    - name: dns-test
      image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.7
      command:
        - sleep
        - "3600"
