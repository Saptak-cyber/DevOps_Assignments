# The "breaking change": someone applied a default-deny ingress policy to the
# web Pods. Every inbound connection to app=web is now dropped.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-deny-all-ingress
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Ingress
