# The database side of the incident in secret-base64-gotcha.md.
# The DB password is set correctly (kubectl encodes --from-literal values itself):
#   kubectl create secret generic postgres-admin --from-literal=POSTGRES_PASSWORD=mypassword
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  containers:
    - name: postgres
      image: postgres:16-alpine
      env:
        - name: POSTGRES_USER
          value: yatri_admin
        - name: POSTGRES_DB
          value: yatri_production_db
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-admin
              key: POSTGRES_PASSWORD
      ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
