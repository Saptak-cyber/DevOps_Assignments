# gitleaks configuration (secret scanning) for the ClinicDesk project.
#   gitleaks dir final-devops-project --config final-devops-project/security/gitleaks.toml
title = "ClinicDesk gitleaks config"

[extend]
useDefault = true          # ~200 built-in rules: AWS keys, GitHub tokens, private keys, generic API keys, ...

# Kubernetes Secret manifests must never carry a real value in Git: anything in a
# Secret's data/stringData other than the documented placeholder is flagged.
[[rules]]
id = "k8s-secret-literal-password"
description = "Kubernetes Secret with a literal password value"
regex = '''(?m)^\s*password:\s*["']?([^\s"'{}]{6,})["']?\s*$'''
secretGroup = 1
keywords = ["password:"]
path = '''(^|/)kubernetes/.*\.ya?ml$'''

  [[rules.allowlists]]
  description = "documented placeholder in the Secret template"
  regexes = ['''^REPLACE_ME$''']

[[allowlists]]
description = "generated reports, dependency trees, Terraform provider caches"
paths = [
  '''(^|/)reports/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.terraform/''',
  '''(^|/)__pycache__/''',
  '''package-lock\.json$''',
]

# Reviewed false positive (curl-auth-user): README commit b1bc8d3 contains a captured command
# `curl -u admin:"$(cat <file>)"` that read an ephemeral Grafana password from a local file; no
# credential value was ever written. The line was removed in the next commit; history can't be.
[[allowlists]]
description = "reviewed false positive in README history"
commits = ["b1bc8d3ebb04fa9ff120554695ca2d4243349456"]
