# Environment values for the EKS deployment, layered on top of helm/clinicdesk/values-prod.yaml
# by the Argo CD Application in gitops/argocd/clinicdesk-application.yaml.
#
# image.tag is owned by CI: the "GitOps promote" job of .github/workflows/final-devops-project.yml
# rewrites both tags to the commit SHA whose images passed the security gate, commits with
# [skip ci], and Argo CD rolls that SHA out. Don't edit the tags by hand.
backend:
  image:
    tag: 8d6553a92455d2a1563021dd8b2400cf7c825c87
  autoscaling: # two t3.medium nodes: keep the HPA ceiling schedulable
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
frontend:
  image:
    tag: 8d6553a92455d2a1563021dd8b2400cf7c825c87
# The ingress-nginx NLB has a generated DNS name, so the rule matches any Host header.
ingress:
  host: ""
