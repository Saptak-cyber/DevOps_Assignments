# A second StorageClass on the same minikube provisioner, but with
# Retain (keep the data when the claim is deleted) and
# WaitForFirstConsumer (do not provision until a Pod actually uses the claim).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: retain-wffc
provisioner: k8s.io/minikube-hostpath
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wffc-pvc
spec:
  storageClassName: retain-wffc
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: wffc-demo
spec:
  containers:
    - name: app
      image: nginx:1.27
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: wffc-pvc
