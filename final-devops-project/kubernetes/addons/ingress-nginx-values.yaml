# ingress-nginx controller for EKS, exposed through an AWS Network Load Balancer.
#   helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx -n ingress-nginx --create-namespace \
#     -f kubernetes/addons/ingress-nginx-values.yaml
# Delete this release BEFORE `terraform destroy`, so AWS removes the NLB and its ENIs
# while the VPC still exists.
controller:
  replicaCount: 1
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  resources:
    requests: {cpu: 50m, memory: 96Mi}
