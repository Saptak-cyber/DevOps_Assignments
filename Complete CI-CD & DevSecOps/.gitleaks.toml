# gitleaks configuration (secret scanning).
# Used as: gitleaks dir . --config .gitleaks.toml   and   gitleaks git ... --config .gitleaks.toml
title = "Session 17 DevSecOps gitleaks config"

# Start from gitleaks' ~200 built-in rules (AWS, GitHub, Slack, private keys, generic API keys, ...)
[extend]
useDefault = true

# Extra rule for the classroom convention from 06-secret-scanning (DEMO_API_KEY=...).
# Catches anyone who replaces the placeholder with a real-looking value.
[[rules]]
id = "course-demo-api-key"
description = "DEMO_API_KEY assigned a non-placeholder value"
regex = '''(?i)\bDEMO_API_KEY\s*[=:]\s*["']?([A-Za-z0-9_\-]{16,})["']?'''
secretGroup = 1
keywords = ["demo_api_key"]

  [[rules.allowlists]]
  description = "the documented placeholder is fine"
  regexes = ['''replace-with-test-value''']

# Generated scanner output and build/test artefacts are never source of truth.
[[allowlists]]
description = "generated reports and caches"
paths = [
  '''(^|/)reports/''',
  '''(^|/)\.pytest_cache/''',
  '''(^|/)__pycache__/''',
  '''\.coverage$''',
]
