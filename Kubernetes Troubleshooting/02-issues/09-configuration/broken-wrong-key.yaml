# Configuration issue #2: the ConfigMap exists, but the Pod asks for a key
# that is not in it (DB_URL vs DATABASE_URL). The kubelet cannot build the
# container's environment -> CreateContainerConfigError.
apiVersion: v1
kind: Pod
metadata:
  name: config-key-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo DATABASE_URL=$DATABASE_URL; sleep 3600"]
      env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_URL          # wrong key
