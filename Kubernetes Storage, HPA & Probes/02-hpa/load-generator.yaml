# Load generator for the HPA demo (same loop as the class's `kubectl run
# load-generator ...` command, kept as a manifest so it can be versioned).
# Hammers hpa-demo-service in a tight wget loop to push nginx CPU past 50%.
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  labels:
    app: load-generator
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - "while true; do wget -q -O- http://hpa-demo-service > /dev/null; done"
