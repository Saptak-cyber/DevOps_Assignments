# Needs metrics-server (minikube: `minikube addons enable metrics-server`) and CPU requests on the pods.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clinicdesk-backend
  namespace: clinicdesk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clinicdesk-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clinicdesk-frontend
  namespace: clinicdesk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clinicdesk-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 75}
