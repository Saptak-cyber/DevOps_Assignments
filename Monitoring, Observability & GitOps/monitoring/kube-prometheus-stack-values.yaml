# kube-prometheus-stack, trimmed for a single-node kind cluster on a laptop.
# helm install kps prometheus-community/kube-prometheus-stack -n monitoring --create-namespace -f kube-prometheus-stack-values.yaml

# kind runs etcd / scheduler / controller-manager / kube-proxy bound to 127.0.0.1,
# so Prometheus cannot scrape them. Disable those monitors and their alert groups
# instead of living with permanent "TargetDown" noise.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false

prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 6h
    retentionSize: 1GB
    # Pick up ServiceMonitors / PodMonitors / PrometheusRules from every namespace,
    # not only the ones labelled release=kps.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi

alertmanager:
  alertmanagerSpec:
    retention: 6h
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

grafana:
  # admin password is generated by the chart and kept in the kps-grafana Secret
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      # 384Mi was OOMKilled while rendering the Kubernetes dashboards (see README);
      # 768Mi leaves headroom for Grafana 13.
      memory: 768Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

prometheus-node-exporter:
  # Docker Desktop's root mount is not rshared; mounting / with HostToContainer
  # propagation makes node-exporter fail to start on kind-on-macOS.
  hostRootFsMount:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 24Mi

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
