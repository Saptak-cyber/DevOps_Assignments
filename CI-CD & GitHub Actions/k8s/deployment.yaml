apiVersion: apps/v1
kind: Deployment
metadata:
  name: s16-calculator
  labels:
    app: s16-calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s16-calculator
  template:
    metadata:
      labels:
        app: s16-calculator
    spec:
      # Created by the deploy job from the workflow's GITHUB_TOKEN so the kind
      # cluster can pull from GHCR even if the package is private.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: calculator
          # The deploy job replaces __IMAGE__ with ghcr.io/saptak-cyber/s16-calculator:<commit-sha>
          image: __IMAGE__
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
