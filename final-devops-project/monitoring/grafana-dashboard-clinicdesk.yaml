# Grafana dashboard for ClinicDesk, loaded by the kube-prometheus-stack Grafana sidecar
# (it watches ConfigMaps labelled grafana_dashboard=1 in every namespace).
#   kubectl apply -f monitoring/grafana-dashboard-clinicdesk.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-clinicdesk
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  clinicdesk.json: |
    {
      "uid": "clinicdesk",
      "title": "ClinicDesk API",
      "tags": [
        "clinicdesk"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "15s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests per second by endpoint",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (handler, method) (rate(http_requests_total{namespace=\"clinicdesk\"}[1m]))",
              "legendFormat": "{{method}} {{handler}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error ratio (4xx / 5xx)",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(http_requests_total{namespace=\"clinicdesk\",status=~\"4xx|5xx\"}[5m])) / ignoring(status) group_left sum(rate(http_requests_total{namespace=\"clinicdesk\"}[5m]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latency p50 / p95",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"clinicdesk\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"clinicdesk\"}[5m])))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Backend replicas (HPA)",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"clinicdesk\"}",
              "legendFormat": "current {{horizontalpodautoscaler}}"
            },
            {
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"clinicdesk\"}",
              "legendFormat": "desired {{horizontalpodautoscaler}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU by pod (cores)",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"clinicdesk\",container!=\"\",container!=\"POD\"}[2m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memory by pod",
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"clinicdesk\",container!=\"\",container!=\"POD\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Backend targets up",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(up{namespace=\"clinicdesk\",service=\"clinicdesk-backend\"})",
              "legendFormat": "up"
            }
          ]
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Appointments booked (POST 2xx, 1h)",
          "gridPos": {
            "x": 6,
            "y": 24,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(http_requests_total{namespace=\"clinicdesk\",handler=\"/api/appointments\",method=\"POST\",status=\"2xx\"}[1h]))",
              "legendFormat": "booked"
            }
          ]
        }
      ]
    }
