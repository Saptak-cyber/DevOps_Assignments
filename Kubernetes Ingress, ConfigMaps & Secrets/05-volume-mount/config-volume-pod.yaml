# Demonstrates the THIRD way to consume a ConfigMap/Secret: as a mounted volume.
#
# The difference that matters in production:
#   - env / envFrom  -> injected ONCE at container start. Editing the ConfigMap
#                       later does NOT change the running process. You must restart.
#   - volume mount   -> the kubelet keeps the files in sync. Editing the ConfigMap
#                       updates the files in place (within ~60s, the kubelet sync
#                       period) with no restart -- IF the app re-reads the file.
apiVersion: v1
kind: Pod
metadata:
  name: config-volume-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        # Same key consumed BOTH ways, so the two behaviours can be compared.
        - name: LOG_LEVEL_FROM_ENV
          valueFrom:
            configMapKeyRef:
              name: yatri-app-config
              key: LOG_LEVEL
      volumeMounts:
        - name: config-volume
          mountPath: /etc/app-config
          readOnly: true
        - name: secret-volume
          mountPath: /etc/app-secrets
          readOnly: true
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
  volumes:
    - name: config-volume
      configMap:
        name: yatri-app-config
    - name: secret-volume
      secret:
        secretName: yatri-db-secret
