{{- /*
  Created only when database.existingSecret is empty. If no password is given, reuse the one
  already stored in the cluster (so upgrades don't lock PostgreSQL out), else generate one.
  GitOps tools render without cluster access, so prod uses existingSecret instead.
*/ -}}
{{- if not .Values.database.existingSecret }}
{{- $name := include "clinicdesk.dbSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.database.password }}
{{- if and (not $password) $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 24 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "clinicdesk.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  username: {{ .Values.database.username | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
{{- end }}
