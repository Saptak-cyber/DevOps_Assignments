# Fixed: key name matches the ConfigMap (DATABASE_URL).
apiVersion: v1
kind: Pod
metadata:
  name: config-key-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo DATABASE_URL=$DATABASE_URL; sleep 3600"]
      env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DATABASE_URL
