# ClinicDesk local stack: PostgreSQL + FastAPI backend + React/nginx frontend.
#   cd docker && docker compose up --build -d
#   UI       http://localhost:3000      (nginx; proxies /api -> backend)
#   API      http://localhost:8000/docs (Swagger), /health, /ready, /metrics
# Dockerfiles live next to the code in ../application/{backend,frontend}.
name: clinicdesk

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: clinicdesk
      POSTGRES_USER: clinicdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicdesk -d clinicdesk"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped
    # Not published to the host: only the backend needs to reach it.

  backend:
    build: ../application/backend
    image: clinicdesk-backend:local
    environment:
      ENVIRONMENT: docker-compose
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: clinicdesk
      DB_USER: clinicdesk
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      CLINIC_TIMEZONE: Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  frontend:
    build: ../application/frontend
    image: clinicdesk-frontend:local
    environment:
      BACKEND_UPSTREAM: backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"
    mem_limit: 64m
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  pgdata:
