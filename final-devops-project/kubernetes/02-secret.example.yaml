# TEMPLATE ONLY. Do not put a real password in Git and do not `kubectl apply` this file as-is.
# Create the real Secret imperatively instead:
#
#   kubectl -n clinicdesk create secret generic clinicdesk-db \
#     --from-literal=username=clinicdesk \
#     --from-literal=password="$(openssl rand -base64 24)"
#
# Both PostgreSQL (POSTGRES_USER/POSTGRES_PASSWORD) and the backend (DB_USER/DB_PASSWORD)
# read these two keys. This file is intentionally excluded from kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: clinicdesk-db
  namespace: clinicdesk
  labels:
    app.kubernetes.io/part-of: clinicdesk
type: Opaque
stringData:
  username: clinicdesk
  password: REPLACE_ME
