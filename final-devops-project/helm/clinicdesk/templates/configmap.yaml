apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clinicdesk.fullname" . }}-config
  labels:
    {{- include "clinicdesk.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  CLINIC_TIMEZONE: {{ .Values.config.clinicTimezone | quote }}
  DB_HOST: {{ include "clinicdesk.dbHost" . | quote }}
  DB_PORT: {{ ternary 5432 .Values.externalDatabase.port .Values.postgres.enabled | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  BACKEND_UPSTREAM: {{ printf "%s-backend:%v" (include "clinicdesk.fullname" .) .Values.backend.port | quote }}
