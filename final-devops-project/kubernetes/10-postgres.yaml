# PostgreSQL as a single-replica StatefulSet with its own PersistentVolumeClaim.
# Fine for a classroom cluster; on AWS a managed database (Amazon RDS) is the production choice.
apiVersion: v1
kind: Service
metadata:
  name: clinicdesk-postgres
  namespace: clinicdesk
  labels: &labels
    app.kubernetes.io/name: clinicdesk
    app.kubernetes.io/component: database
spec:
  clusterIP: None            # headless: stable DNS for the StatefulSet pod
  selector: *labels
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clinicdesk-postgres
  namespace: clinicdesk
  labels:
    app.kubernetes.io/name: clinicdesk
    app.kubernetes.io/component: database
spec:
  serviceName: clinicdesk-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clinicdesk
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinicdesk
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # "postgres" user in the Alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: clinicdesk-config, key: DB_NAME}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: clinicdesk-db, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: clinicdesk-db, key: password}}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true      # data lives on the PVC, sockets/temp on emptyDirs
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql   # PG 18 keeps PGDATA in a versioned subdirectory
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
