# Written for this task: the same Service name in two namespaces, so short-name
# vs FQDN resolution can be told apart by which one answers.
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-b
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          lifecycle:
            postStart:
              exec:
                command: ["sh", "-c", "echo 'I am the API in namespace team-a' > /usr/share/nginx/html/index.html"]
---
apiVersion: v1
kind: Service
metadata:
  name: api            # same Service name as in team-b
  namespace: team-a
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: team-b
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          lifecycle:
            postStart:
              exec:
                command: ["sh", "-c", "echo 'I am the API in namespace team-b' > /usr/share/nginx/html/index.html"]
---
apiVersion: v1
kind: Service
metadata:
  name: api            # same Service name as in team-a
  namespace: team-b
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 80 }]
---
# A client pod living in team-a, to show what a SHORT name resolves to.
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: team-a
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.7.1
      command: ["sleep", "infinity"]
