# Busy-loops on one CPU (capped at 0.5 core) to trip Session20HighPodCPU.
apiVersion: v1
kind: Pod
metadata:
  name: cpu-burner
  labels:
    app: cpu-burner
spec:
  containers:
    - name: burn
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo burning CPU; while true; do :; done"]
      resources:
        requests:
          cpu: 100m
        limits:
          cpu: 500m
          memory: 32Mi
